# This is the configuration file for klipper software
# NOTE: The serial path below is just a placeholder
# Once the STM32 is flashed and connected to the Raspberry Pi via USB,
# you must SSH into the Pi and run the following command to find your unique MCU ID
# ls /dev/serial/by-id/*
# Then copy the output and replace the serial path below with your specific ID

# PROFI3DMAKER - CUSTOM STM32F407VET6 MOTHERBOARD CONFIGURATION

[include mainsail.cfg]

[printer]
kinematics: cartesian
max_velocity: 230
max_accel: 3000
max_z_velocity: 3
max_z_accel: 10

[mcu]
serial: /dev/ttyAMA0
baud: 250000

[force_move]
enable_force_move: True

# KROKOVÉ MOTORY A DRIVERY (TMC2209)

[stepper_x]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 48
endstop_pin: ^PD2
position_endstop: 0
position_max: 400
full_steps_per_rotation: 400

[tmc2209 stepper_x]

uart_pin: ^PD5
run_current: 0.800
stealthchop_threshold: 999999


[stepper_y]

step_pin: PA8
dir_pin: !PC9
enable_pin: !PA10
microsteps: 16
rotation_distance: 48
#endstop_pin: probe:z_virtual_endstop
endstop_pin: ^PD7
position_endstop: 0
position_max: 260
position_min: -2
full_steps_per_rotation: 400


[tmc2209 stepper_y]
uart_pin: ^PA9
run_current: 0.800
stealthchop_threshold: 999999

[stepper_y1]
step_pin: PD12
dir_pin: !PD13
enable_pin: !PD9
microsteps: 16
rotation_distance: 48
full_steps_per_rotation: 400

[tmc2209 stepper_y1]
uart_pin: ^PD11
run_current: 0.800
stealthchop_threshold: 999999


[stepper_z]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7
microsteps: 16          
rotation_distance: 3
full_steps_per_rotation: 200
endstop_pin: ^PC8
position_endstop: 0        
position_max: 190
position_min: -5

[tmc2209 stepper_z]
uart_pin: ^PC6
run_current: 0.6      
#interpolate: True     
stealthchop_threshold: 999999


[stepper_z1]
step_pin: PE10
dir_pin: PE11
enable_pin: !PE7
microsteps: 16        
rotation_distance: 3
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: ^PE9
diag_pin: ^PE8
run_current: 0.6    
#interpolate: True
stealthchop_threshold: 999999

[extruder]
step_pin: PE15
dir_pin: PB12
enable_pin: !PE12
microsteps: 16
rotation_distance: 33.93
nozzle_diameter: 0.500
filament_diameter: 1.750
heater_pin: PB0
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA1
control: pid
pid_kp: 22.2
pid_ki: 1.08
pid_kd: 114
min_temp: -100
max_temp: 250
full_steps_per_rotation: 400

[tmc2209 extruder]
uart_pin: ^PE14
diag_pin: ^PE13
run_current: 0.800
stealthchop_threshold: 999999

# VYHŘÍVANÁ PODLOŽKA

[heater_bed]
heater_pin: PB8
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA2
control: pid
pid_kp: 54.027
pid_ki: 0.770
pid_kd: 948.182
min_temp: -100
max_temp: 100

# VENTILÁTORY

[fan_generic test_fan2]
pin: PB9

[heater_fan hotend_fan]
pin: PB1

[fan]
pin: PB7

# Z-SONDA CR-TOUCH 

[bltouch]
sensor_pin: ^PC4
control_pin: PA3
x_offset: -22.1
y_offset: -41.25
z_offset: 0
probe_with_touch_mode: True

#[safe_z_home]
#home_xy_position: 200, 130
#speed: 50
#z_hop: 10
#z_hop_speed: 5

#[z_tilt]
#z_positions:
#    -50, 10
#    200, 300
#    450, 10
#points:
#    50, 50
#    200, 210
#    350, 50
#speed: 100
#horizontal_move_z: 10

# ADXL345 

[mcu accel]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50443404188A101C-if00

[lis2dw]
cs_pin: accel:gpio9
spi_software_sclk_pin: accel:gpio10
spi_software_mosi_pin: accel:gpio11
spi_software_miso_pin: accel:gpio8
axes_map: x,y,z

[resonance_tester]
accel_chip: lis2dw
probe_points:
    200, 130, 20

# DISPLEJ A UŽIVATELSKÉ ROZHRANÍ


#[display]
#lcd_type: st7789v
#cs_pin: PE5
#dc_pin: PB15
#reset_pin: PE4
#encoder_pins: ^PC2, ^PC1
#click_pin: ^!PD8

#[beeper]
#pin: PE6


# SENZOR FILAMENTU


[filament_switch_sensor fil_runout]
switch_pin: ^PE2
pause_on_runout: True

# LED OSVĚTLENÍ A LASER

[neopixel my_neopixel]
pin: PB6
chain_count: 1
color_order: GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[output_pin LED_RED]
pin: PB14
pwm: True

[output_pin LED_GREEN]
pin: PE3
pwm: True

[output_pin LED_BLUE]
pin: PB13
pwm: True

[output_pin laser_pwm]
pin: PB5
pwm: True

# ZÁLOŽNÍ TERMISTOR

[temperature_sensor extra_thermistor]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA0

#SD KARTA - NENÍ MOŽNÉ POUŽÍT, PROTOŽE TO KLIPPER NEPODPORUJE - DAVAL JSEM TO TAM ZBYTECNE

#[sdcard]
#spi_software_sclk_pin: PC10
#spi_software_mosi_pin: PC12
#spi_software_miso_pin: PC11
#cs_pin: PD0

[verify_heater heater_bed]
max_error: 999999
check_gain_time: 999

[bed_mesh]
speed: 150
horizontal_move_z: 6
mesh_min: 30, 50        
mesh_max: 330, 180      
probe_count: 5, 5       
algorithm: bicubic

